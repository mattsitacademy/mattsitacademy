services:

  backend:
    build:
      context: ./backend
    container_name: matts-backend
    ports:
      - "5000:5000"
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    container_name: matts-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

